
trigger:
  branches:
    include:
      - main
      - develop

# 2. Validation des Pull Requests
pr:
  branches:
    include:
      - main
      - develop

# 3. Agent personnel Windows
pool:
  name: 'Default'

# 4. Variables du projet
variables:
  NODE_VERSION: '22.x'
  ANDROID_HOME: 'C:\Users\hp\AppData\Local\Android\Sdk'
  ANDROID_SDK_ROOT: 'C:\Users\hp\AppData\Local\Android\Sdk'

  # Remplacer par les vraies clés de SonarQube Cloud
  SONAR_ORGANIZATION: 'SonarCloud-Connection'
  SONAR_PROJECT_KEY: '886f47db9a5440a0af19c995cba4fe3f96e89d98'

stages:

  - stage: Build_Test
    displayName: 'Build, Tests et Analyse de qualité'

    jobs:
      - job: CI
        displayName: 'Validation de TodoApp'

        steps:

          # 1. Récupérer le code source
          # Historique complet nécessaire pour SonarCloud
          - checkout: self
            clean: true
            fetchDepth: 0

          # 2. Installer Node.js
          - task: NodeTool@0
            displayName: 'Installer Node.js 22'
            inputs:
              versionSpec: '$(NODE_VERSION)'

          # 3. Vérifier Java et Android SDK
          - task: PowerShell@2
            displayName: 'Vérifier environnement Android'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Verification des outils..."
                
                node --version
                npm --version
                java -version
                
                if (!(Test-Path "$(ANDROID_HOME)")) {
                  throw "Android SDK introuvable"
                }
                
                $env:ANDROID_HOME = "$(ANDROID_HOME)"
                $env:ANDROID_SDK_ROOT = "$(ANDROID_SDK_ROOT)"
                
                Write-Host "Android SDK trouve"
                Write-Host "Environnement pret"

          # 4. Préparer l'analyse SonarQube Cloud
          - task: SonarCloudPrepare@4
            displayName: 'Préparer analyse SonarCloud'
            inputs:
              SonarCloud: 'SonarCloud-Connection'
              organization: '$(SONAR_ORGANIZATION)'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: '$(SONAR_PROJECT_KEY)'
              cliProjectName: 'TodoApp'
              cliSources: '.'
              extraProperties: |
                sonar.exclusions=**/node_modules/**,**/android/**,**/ios/**,**/coverage/**,**/*.test.js,**/*.spec.js,**/__tests__/**
                sonar.javascript.lcov.reportPaths=coverage/lcov.info

          # 5. Installer les dépendances npm
          - script: npm ci
            displayName: 'Installer les dépendances npm'

          # 6. Analyse statique ESLint
          - script: npm run lint
            displayName: 'Analyse statique ESLint'

          # 7. Exécuter les tests unitaires Jest
          # Générer les rapports Cobertura et LCOV
          - script: >
              npm test -- --runInBand --coverage --ci
              --coverageReporters=cobertura
              --coverageReporters=lcov
            displayName: 'Exécuter les tests Jest'

          # 8. Publier le rapport de couverture
          - task: PublishCodeCoverageResults@2
            displayName: 'Publier couverture des tests'
            inputs:
              summaryFileLocation: '$(Build.SourcesDirectory)\coverage\cobertura-coverage.xml'
              failIfCoverageEmpty: false
            condition: succeededOrFailed()

          # 9. Analyse de sécurité des dépendances npm
          - script: npm audit --audit-level=high
            displayName: 'Vérification des vulnérabilités npm'

          # 10. Lancer l'analyse SonarCloud
          - task: SonarCloudAnalyze@4
            displayName: 'Analyser le code avec SonarCloud'
            inputs:
              jdkversion: 'JAVA_HOME_17_X64'

          # 11. Publier le résultat du Quality Gate
          - task: SonarCloudPublish@4
            displayName: 'Publier le Quality Gate'
            inputs:
              pollingTimeoutSec: '300'

          # 12. Compiler APK et AAB avec Gradle
          - task: PowerShell@2
            displayName: 'Compiler APK et AAB avec Gradle'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(Build.SourcesDirectory)\android'
              script: |
                $sdk = "$(ANDROID_HOME)"
                
                if (!(Test-Path $sdk)) {
                  throw "Android SDK introuvable"
                }
                
                $env:ANDROID_HOME = $sdk
                $env:ANDROID_SDK_ROOT = $sdk
                
                # Créer local.properties
                $sdkPath = $sdk -replace '\\', '/'
                $localProperties = "sdk.dir=$sdkPath"
                
                [System.IO.File]::WriteAllText(
                  "local.properties",
                  $localProperties,
                  [System.Text.UTF8Encoding]::new($false)
                )
                
                # Compiler APK et AAB
                .\gradlew.bat clean assembleRelease bundleRelease
                
                if ($LASTEXITCODE -ne 0) {
                  throw "Compilation Gradle echouee"
                }

          # 13. Publier APK dans Azure Pipelines Artifacts
          - task: PublishPipelineArtifact@1
            displayName: 'Publier APK'
            inputs:
              targetPath: '$(Build.SourcesDirectory)\android\app\build\outputs\apk\release'
              artifact: 'TodoApp-APK'
              publishLocation: 'pipeline'

          # 14. Publier AAB dans Azure Pipelines Artifacts
          - task: PublishPipelineArtifact@1
            displayName: 'Publier AAB'
            inputs:
              targetPath: '$(Build.SourcesDirectory)\android\app\build\outputs\bundle\release'
              artifact: 'TodoApp-AAB'
              publishLocation: 'pipeline'
