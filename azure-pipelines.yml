trigger:
  branches:
    include: [main, develop]

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build_Test
  displayName: Build et Tests
  jobs:
  - job: CI
    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '22.x'
      displayName: 'Installer Node 22'

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'
      displayName: 'Installer JDK 17'

    - script: npm ci
      displayName: 'Installer les dépendances'

    - script: npm run lint
      displayName: 'Analyse statique (ESLint)'

    - script: npm test -- --coverage --ci
      displayName: 'Tests unitaires (Jest)'

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: 'coverage/cobertura-coverage.xml'
      condition: succeededOrFailed()

    - script: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease
      displayName: 'Build APK (Gradle)'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: 'android/app/build/outputs/apk/release/app-release.apk'
        artifact: 'apk'
      displayName: 'Publier APK'

# Étapes suivantes (à ajouter): SonarQube/SonarCloud, signature, Firebase App Distribution
