
trigger:
  branches:
    include:
      - main
      - develop
      - feature/*

# 2. Validation des Pull Requests
pr:
  branches:
    include:
      - main
      - develop

# 3. Agent personnel Windows
pool:
  name: 'Default'

# 4. Variables du projet
variables:
  NODE_VERSION: '22.x'
  ANDROID_HOME: 'C:\Users\hp\AppData\Local\Android\Sdk'
  ANDROID_SDK_ROOT: 'C:\Users\hp\AppData\Local\Android\Sdk'

  # Remplacer par les vraies clés de SonarQube Cloud
  SONAR_ORGANIZATION: 'salmajaghoua23'
  SONAR_PROJECT_KEY: 'salmajaghoua23_TodoApp'

  # Supabase : URL du projet + clé PUBLIQUE (anon / publishable). Jamais la clé secret/service_role.
  SUPABASE_URL: 'https://wjzpfxzcylrokauevxly.supabase.co'
  SUPABASE_KEY: 'sb_publishable__tS71L9cNzwtqZCFSSW6zg_WcLczXeg'
  # Firebase App Distribution
  # App ID : Firebase > Paramètres du projet > Général > Vos applications (format 1:123...:android:abc...)
  FIREBASE_APP_ID: '1:649512825504:android:cb45c2df24e87672280fc5'
  FIREBASE_GROUP: 'testeurs'

stages:

  - stage: Build_Test
    displayName: 'Build, Tests et Analyse de qualité'

    jobs:
      - job: CI
        displayName: 'Validation de TodoApp'

        steps:

          # 1. Récupérer le code source
          # Historique complet nécessaire pour SonarCloud
          - checkout: self
            clean: true
            fetchDepth: 0

          # 2. Installer Node.js
          - task: UseNode@1
            displayName: 'Installer Node.js 22'
            inputs:
              version: '$(NODE_VERSION)'

          # 3. Vérifier Java et Android SDK
          - task: PowerShell@2
            displayName: 'Vérifier environnement Android'
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "Verification des outils..."
                
                node --version
                npm --version
                java -version
                
                if (!(Test-Path "$(ANDROID_HOME)")) {
                  throw "Android SDK introuvable"
                }
                
                $env:ANDROID_HOME = "$(ANDROID_HOME)"
                $env:ANDROID_SDK_ROOT = "$(ANDROID_SDK_ROOT)"
                
                Write-Host "Android SDK trouve"
                Write-Host "Environnement pret"

          # 4. Préparer l'analyse SonarQube Cloud
          - task: SonarCloudPrepare@4
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            displayName: 'Préparer analyse SonarCloud'
            inputs:
              SonarCloud: 'SonarCloud-Connection'
              organization: '$(SONAR_ORGANIZATION)'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: '$(SONAR_PROJECT_KEY)'
              cliProjectName: 'TodoApp'
              cliSources: '.'
              extraProperties: |
                sonar.exclusions=**/node_modules/**,**/android/**,**/ios/**,**/coverage/**,**/*.test.js,**/*.spec.js,**/__tests__/**,**/test-utils/**,**/*.sql
                sonar.coverage.exclusions=**/supabase.js,**/config.js
                sonar.javascript.lcov.reportPaths=coverage/lcov.info
          # 5. Installer les dépendances npm
          - script: npm ci
            displayName: 'Installer les dépendances npm'

          # 6. Analyse statique ESLint
          - script: npm run lint
            displayName: 'Analyse statique ESLint'

          # 7. Exécuter les tests unitaires Jest
          # Générer les rapports Cobertura et LCOV
          - script: >
              npm test -- --runInBand --coverage --ci
              --coverageReporters=cobertura
              --coverageReporters=lcov
            displayName: 'Exécuter les tests Jest'

          # 7b. Publier les résultats des tests (junit.xml généré par jest-junit)
          - task: PublishTestResults@2
            displayName: 'Publier les résultats des tests'
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: 'coverage/junit.xml'
              failTaskOnFailedTests: true
            condition: succeededOrFailed()

          # 8. Publier le rapport de couverture
          - task: PublishCodeCoverageResults@2
            displayName: 'Publier couverture des tests'
            inputs:
              summaryFileLocation: '$(Build.SourcesDirectory)\coverage\cobertura-coverage.xml'
              failIfCoverageEmpty: false
            condition: succeededOrFailed()

          # 9. Analyse de sécurité des dépendances npm
          - script: npm audit --audit-level=high
            displayName: 'Vérification des vulnérabilités npm'
            continueOnError: true
          # 10. Lancer l'analyse SonarCloud
          - task: SonarCloudAnalyze@4
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            displayName: 'Analyser le code avec SonarCloud'
            inputs:
              jdkversion: 'JAVA_HOME_17_X64'

          # 11. Publier le résultat du Quality Gate
          - task: SonarCloudPublish@4
            displayName: 'Publier le Quality Gate'
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            continueOnError: true
            inputs:
              pollingTimeoutSec: '300'

          # 11b. Injecter la config Supabase avant la compilation
          - task: PowerShell@2
            displayName: 'Générer src/v2/config.js (Supabase)'
            env:
              SUPABASE_URL: $(SUPABASE_URL)
              SUPABASE_KEY: $(SUPABASE_KEY)
            inputs:
              targetType: 'inline'
              script: |
                if (-not $env:SUPABASE_URL -or $env:SUPABASE_URL -like 'YOUR-*' -or $env:SUPABASE_URL -like '*YOUR-PROJECT-REF*') {
                  throw "SUPABASE_URL non renseigne dans la section variables du YAML"
                }
                if (-not $env:SUPABASE_KEY -or $env:SUPABASE_KEY -like 'YOUR-*') {
                  throw "SUPABASE_KEY non renseignee dans la section variables du YAML"
                }
                $content = @"
                export const SUPABASE_URL = '$($env:SUPABASE_URL)';
                export const SUPABASE_KEY = '$($env:SUPABASE_KEY)';
                export const isConfigured = true;
                "@
                [System.IO.File]::WriteAllText(
                  "$(Build.SourcesDirectory)\src\v2\config.js",
                  $content,
                  [System.Text.UTF8Encoding]::new($false)
                )

          # 12. Compiler APK et AAB avec Gradle
          - task: PowerShell@2
            displayName: 'Compiler APK et AAB avec Gradle'
            inputs:
              targetType: 'inline'
              workingDirectory: '$(Build.SourcesDirectory)\android'
              script: |
                $sdk = "$(ANDROID_HOME)"
                
                if (!(Test-Path $sdk)) {
                  throw "Android SDK introuvable"
                }
                
                $env:ANDROID_HOME = $sdk
                $env:ANDROID_SDK_ROOT = $sdk
                
                # Créer local.properties
                $sdkPath = $sdk -replace '\\', '/'
                $localProperties = "sdk.dir=$sdkPath"
                
                [System.IO.File]::WriteAllText(
                  "local.properties",
                  $localProperties,
                  [System.Text.UTF8Encoding]::new($false)
                )
                
                # Compiler APK et AAB
                .\gradlew.bat clean assembleRelease bundleRelease
                
                if ($LASTEXITCODE -ne 0) {
                  throw "Compilation Gradle echouee"
                }

          # 13. Publier APK dans Azure Pipelines Artifacts
          - task: PublishPipelineArtifact@1
            displayName: 'Publier APK'
            inputs:
              targetPath: '$(Build.SourcesDirectory)\android\app\build\outputs\apk\release'
              artifact: 'TodoApp-APK'
              publishLocation: 'pipeline'

          # 14. Publier AAB dans Azure Pipelines Artifacts
          - task: PublishPipelineArtifact@1
            displayName: 'Publier AAB'
            condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop'))
            inputs:
              targetPath: '$(Build.SourcesDirectory)\android\app\build\outputs\bundle\release'
              artifact: 'TodoApp-AAB'
              publishLocation: 'pipeline'

          # 15. Publier APK dans Azure Artifacts Feed
          - task: UniversalPackages@0
            displayName: 'Publier APK dans Azure Artifacts'
            condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop'))
            inputs:
              command: 'publish'
              publishDirectory: '$(Build.SourcesDirectory)\android\app\build\outputs\apk\release'
              feedsToUsePublish: 'internal'
              vstsFeedPublish: 'toDoApp/TodoAppFeed'
              vstsFeedPackagePublish: 'todoapp-apk'
              versionOption: 'custom'
              versionPublish: '1.0.$(Build.BuildId)'
              packagePublishDescription: 'TodoApp Android APK'

          # 16. Publier AAB dans Azure Artifacts Feed
          - task: UniversalPackages@0
            displayName: 'Publier AAB dans Azure Artifacts'
            inputs:
              command: 'publish'
              publishDirectory: '$(Build.SourcesDirectory)\android\app\build\outputs\bundle\release'
              feedsToUsePublish: 'internal'
              vstsFeedPublish: 'toDoApp/TodoAppFeed'
              vstsFeedPackagePublish: 'todoapp-aab'
              versionOption: 'custom'
              versionPublish: '1.0.$(Build.BuildId)'
              packagePublishDescription: 'TodoApp Android App Bundle'

          # 17. Récupérer la clé du compte de service Firebase (Pipelines > Library > Secure files)
          - task: DownloadSecureFile@1
            name: firebaseKey
            displayName: 'Télécharger la clé Firebase'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              secureFile: 'todoapp-cicd-6b8d564f93e1.json'

              # 18. Distribuer l'APK aux testeurs via Firebase App Distribution
          - task: PowerShell@2
            displayName: 'Distribuer APK avec Firebase App Distribution'
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            env:
              GOOGLE_APPLICATION_CREDENTIALS: $(firebaseKey.secureFilePath)
            inputs:
              targetType: 'inline'
              script: |
                $key = Get-Content $env:GOOGLE_APPLICATION_CREDENTIALS -Raw | ConvertFrom-Json
                Write-Host "Compte de la cle: $($key.client_email)"
                Write-Host "Projet de la cle: $($key.project_id)"

                $apk = Get-ChildItem "$(Build.SourcesDirectory)\android\app\build\outputs\apk\release" -Filter *.apk | Select-Object -First 1

                if (-not $apk) {
                  throw "Aucun APK trouve dans android\app\build\outputs\apk\release"
                }

                Write-Host "APK a distribuer : $($apk.FullName)"

                npx --yes firebase-tools appdistribution:distribute "$($apk.FullName)" --app "$(FIREBASE_APP_ID)" --groups "$(FIREBASE_GROUP)" --release-notes "Build $(Build.BuildId) - $(Build.SourceVersionMessage)"  --debug

                if ($LASTEXITCODE -ne 0) {
                  throw "Distribution Firebase echouee"
                }